
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>To Do List App</title>
</head>

<body>

    <!-- =========================
         Background Decorations
    ========================== -->

    <div class="background-decorations">

        <div class="sticky-note note-one">
            <span>✓</span>
            Buy groceries
        </div>

        <div class="sticky-note note-two">
            <span>★</span>
            Study today
        </div>

        <div class="sticky-note note-three">
            <span>✓</span>
            Finish project
        </div>

        <div class="floating-check check-one">✓</div>

        <div class="floating-check check-two">✓</div>

        <div class="floating-check check-three">✓</div>

        <div class="floating-pencil pencil-one">✏️</div>

        <div class="floating-pencil pencil-two">✏️</div>

        <div class="floating-paper paper-one">
            <div></div>
            <div></div>
            <div></div>
        </div>

        <div class="floating-paper paper-two">
            <div></div>
            <div></div>
            <div></div>
        </div>

        <div class="tiny-star star-one">✦</div>
        <div class="tiny-star star-two">✦</div>
        <div class="tiny-star star-three">✧</div>
        <div class="tiny-star star-four">✦</div>

    </div>


    <section class="app">

        <!-- Header -->

        <header>
            <h1 class="header">To Do List App</h1>

            <p class="project-desc">
                Write your to do list
            </p>

            <p class="task-count">
                📋 <span id="taskCount">0</span> Tasks
            </p>
        </header>


        <!-- Form -->

        <form class="task-form">

            <h2 class="form-title">
                Let’s Get Things Done!
            </h2>


            <!-- Task Title -->

            <div class="form-input">

                <label for="taskTitle">
                    Task Title
                </label>

                <input
                    type="text"
                    id="taskTitle"
                    placeholder="Write your task title"
                    name="taskTitle"
                >

            </div>


            <span class="task-title-warning">
                Task Title must have at least 4 characters
            </span>


            <!-- Task Description -->

            <div class="form-input">

                <label for="taskDesc">
                    Task Description
                </label>

                <textarea
                    id="taskDesc"
                    placeholder="Write your task description"
                    name="taskDesc"
                ></textarea>

            </div>


            <span class="task-desc-warning">
                Task Description must have at least 10 characters
            </span>


            <!-- Priority -->

            <div class="form-input">

                <label for="taskPriority">
                    Task Priority
                </label>

                <select
                    id="taskPriority"
                    name="taskPriority"
                >
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>

            </div>


            <!-- Buttons -->

            <div class="form-btns">

                <button
                    type="submit"
                    id="save"
                    class="btn save"
                >
                    Save
                </button>

                <button
                    type="button"
                    id="cancel"
                    class="btn cancel"
                >
                    Cancel
                </button>

            </div>

        </form>


        <!-- Tasks -->

        <section class="tasks-section">

            <h2 class="tasks-title">
                My Tasks
            </h2>

            <div class="container"></div>

            <div class="no-tasks">
                No Tasks Yet
            </div>

        </section>

    </section>


    <script src="script.js"></script>

</body>

</html>
